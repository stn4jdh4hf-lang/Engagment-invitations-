<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة خطوبة</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F7;--ink:#14213D;--soft:#4E5A78;--gold:#8A6A1F;--card:#FFFFFF;--line:#C9D0E0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1226;--ink:#F3EBDA;--soft:#A9B3CE;--gold:#E0BC72;--card:#121B38;--line:#2A3760}}
:root[data-theme="dark"]{--bg:#0B1226;--ink:#F3EBDA;--soft:#A9B3CE;--gold:#E0BC72;--card:#121B38;--line:#2A3760}
html{height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;line-height:1.8;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:24px 18px 40px;text-align:center}
.arch{background:var(--card);border:2px solid var(--gold);border-radius:220px 220px 20px 20px;padding:64px 22px 34px;box-shadow:0 0 0 7px var(--card),0 0 0 8px var(--line)}
.names{font-family:"Reem Kufi","Amiri",serif;font-weight:700;margin:0;line-height:1.35}
.n{display:block;font-size:3rem}
.amp{display:block;color:var(--gold);font-size:1.3rem;font-weight:500;margin:4px 0}
.lead{margin:0 0 8px;color:var(--soft)}
.big{font-family:"Reem Kufi",serif;font-size:1.5rem;margin:22px 0 4px;color:var(--gold)}
.when{margin:0;font-weight:700;font-size:1.1rem}.where{margin:0;color:var(--soft)}
.count{display:flex;justify-content:center;gap:14px;margin:24px 0 6px}
.count div{min-width:56px}.count b{display:block;font-family:"Reem Kufi",serif;font-size:1.7rem;color:var(--gold);line-height:1.3}
.count small{color:var(--soft)}
.msg{margin:24px 0 4px;padding:16px;border-radius:16px;background:var(--bg);border:1px dashed var(--gold);font-weight:500}
.btns{display:grid;gap:10px;margin-top:20px}
.btn{display:block;text-decoration:none;font:inherit;font-weight:700;padding:13px;border-radius:999px;border:1.5px solid var(--gold);color:var(--ink)}
.btn.main{background:var(--gold);color:var(--card)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.kids{display:flex;justify-content:center;gap:18px;margin:22px 0 4px}
.kid{margin:0;width:42%}
.kid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(1);border-radius:50% 50% 14px 14px;border:2px solid var(--gold);padding:3px;background:var(--card)}
.kid figcaption{margin-top:6px;color:var(--soft);font-size:.9rem}
</style>
</head>
<body>
